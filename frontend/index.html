<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>Postbox</title>
    <link rel="stylesheet" href="./app.css">
    <script type="module" src="./app.js"></script>
</head>
<body x-data="mailbox">
    <div class="app-shell">
        <div class="auth-loading" x-show="authChecking" role="status"><i class="ti ti-loader-2 icon-spin" aria-hidden="true"></i><span>Opening Postbox…</span></div>
        <main class="login-page" x-show="!authChecking && !authenticated" x-cloak>
            <form class="login-form" @submit.prevent="login()" :aria-busy="authBusy">
                <span class="login-icon"><i class="ti ti-inbox" aria-hidden="true"></i></span>
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" x-model="username" required :disabled="authBusy" autocapitalize="none" spellcheck="false">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" x-model="password" required :disabled="authBusy">
                <p class="login-error" x-show="authError" x-text="authError" role="alert"></p>
                <button class="login-button" type="submit" :disabled="authBusy"><i class="ti ti-loader-2 icon-spin" x-show="authBusy" aria-hidden="true"></i><span x-text="authBusy ? 'Logging in…' : 'Log in'"></span></button>
            </form>
        </main>
        <main class="mail-workspace" :class="{ 'show-reader': mobileReader }" x-show="!authChecking && authenticated" x-cloak>
            <section class="inbox-panel" aria-label="Inbox messages">
                <div class="inbox-heading">
                    <div class="inbox-title"><i class="ti ti-inbox" aria-hidden="true"></i><h1>Inbox</h1><span class="count-badge" x-text="count"></span></div>
                    <div class="heading-actions">
                        <button class="icon-button" @click="loadMessages()" :disabled="loading" title="Refresh inbox" aria-label="Refresh inbox"><i class="ti ti-refresh" :class="{ 'icon-spin': loading }" aria-hidden="true"></i></button>
                        <button class="icon-button danger" @click="clearInbox()" :disabled="loading || count === 0" title="Delete all messages" aria-label="Delete all messages"><i class="ti ti-trash-x" aria-hidden="true"></i></button>
                    </div>
                </div>
                <div class="search-area"><label class="search-field"><i class="ti ti-search" aria-hidden="true"></i><input type="search" aria-label="Search messages by subject" placeholder="Search by subject…" x-model="search" @input.debounce.300ms="loadMessages(true)"></label></div>
                <div class="list-caption"><span x-text="search.trim() ? 'SEARCH RESULTS' : 'ALL MESSAGES'"></span><span x-text="unread + ' unread'"></span></div>
                <div class="message-list" :aria-busy="loading">
                    <div class="list-notice error-notice" x-show="error" role="alert"><i class="ti ti-alert-circle" aria-hidden="true"></i><p x-text="error"></p><button @click="loadMessages()">Try again</button></div>
                    <div class="list-notice" x-show="loading && !messages.length && !error" role="status"><i class="ti ti-loader-2 icon-spin" aria-hidden="true"></i><p>Loading your inbox…</p></div>
                    <div class="list-notice" x-show="!loading && !error && !messages.length"><span class="notice-icon"><i :class="search.trim() ? 'ti ti-search' : 'ti ti-mail'" aria-hidden="true"></i></span><h2 x-text="search.trim() ? 'No matches found' : 'A fresh, empty inbox'"></h2><p x-text="search.trim() ? 'Try a different subject or clear your search.' : 'Your incoming messages will appear here.'"></p><button x-show="search.trim()" @click="search = ''; loadMessages(true)">Clear search</button></div>
                    <template x-for="message in messages" :key="message.id">
                        <div class="message-row" :class="{ 'is-selected': currentMessage?.id === message.id, 'is-unread': !message.is_read }">
                            <button class="message-select" :aria-current="currentMessage?.id === message.id ? 'true' : null" @click="openMessage(message)">
                            <span class="sender-avatar" :class="senderColor(message)" x-text="initials(message)"></span>
                            <span class="message-summary"><span class="message-topline"><span class="sender-name" x-text="message.from_name || message.from_email || 'Unknown sender'"></span><time :datetime="message.sent_at" :title="fullDate(message.sent_at)" x-text="relativeDate(message.sent_at)"></time></span><span class="message-subject" x-text="message.subject || '(No subject)'"></span><span class="message-bottomline"><span class="sender-email" x-text="message.from_email || 'No sender address'"></span></span></span>
                            </button>
                            <button class="read-toggle" :class="{ 'is-unread': !message.is_read }" :disabled="readUpdates.includes(message.id) || (messageLoading && currentMessage?.id === message.id)" :aria-label="message.is_read ? 'Mark as unread' : 'Mark as read'" :title="message.is_read ? 'Mark as unread' : 'Mark as read'" @click="toggleRead(message)"><span aria-hidden="true"></span></button>
                        </div>
                    </template>
                </div>
                <footer class="list-footer">
                    <div class="account" :title="inbox || 'Your inbox'"><span class="account-avatar" x-text="(inbox || 'P').slice(0, 1).toUpperCase()"></span><span class="account-label" x-text="inbox || 'Your inbox'"></span><button class="icon-button" @click="logout()" :disabled="authBusy" title="Log out" aria-label="Log out"><i class="ti ti-logout" aria-hidden="true"></i></button></div>
                    <nav class="pagination" aria-label="Message pages"><button class="icon-button" @click="changePage(-1)" :disabled="page <= 1 || loading" aria-label="Previous page" title="Previous page"><i class="ti ti-chevron-left" aria-hidden="true"></i></button><span class="page-position" aria-live="polite" x-text="page + '/' + (search.trim() ? (hasNext ? '…' : page) : Math.max(1, Math.ceil(count / 50)))"></span><button class="icon-button" @click="changePage(1)" :disabled="!hasNext || loading" aria-label="Next page" title="Next page"><i class="ti ti-chevron-right" aria-hidden="true"></i></button></nav>
                </footer>
            </section>
            <section class="reading-panel" aria-label="Message content" :aria-busy="messageLoading">
                <div class="reader-empty" x-show="!currentMessage"><div class="empty-illustration"><i class="ti ti-mail-opened" aria-hidden="true"></i><span class="illustration-dot"></span></div><h2>A little space to read.</h2><p>Select a message to see what’s inside.</p></div>
                <template x-if="currentMessage">
                    <div class="reader-content">
                        <div class="reader-toolbar"><button class="back-button" @click="mobileReader = false"><i class="ti ti-arrow-left" aria-hidden="true"></i> Inbox</button><span class="reader-eyebrow">MESSAGE</span><div class="reader-actions"><button class="icon-button danger" @click="deleteMessage()" :disabled="deletingMessage || messageLoading" title="Delete message" aria-label="Delete message"><i class="ti ti-trash" aria-hidden="true"></i></button><div class="body-switch" role="group" aria-label="Message format"><button :class="{ active: bodyMode === 'html' }" :aria-pressed="bodyMode === 'html'" @click="bodyMode = 'html'">HTML</button><button :class="{ active: bodyMode === 'text' }" :aria-pressed="bodyMode === 'text'" @click="bodyMode = 'text'">Text</button></div></div></div>
                        <div class="reader-scroll">
                            <header class="message-header">
                                <h2 x-text="currentMessage.subject || '(No subject)'"></h2>
                                <div class="message-sender"><span class="sender-avatar large" :class="senderColor(currentMessage)" x-text="initials(currentMessage)"></span><div class="sender-details"><div class="sender-identity"><strong x-text="currentMessage.from_name || currentMessage.from_email || 'Unknown sender'"></strong><span x-show="currentMessage.from_name" x-text="currentMessage.from_email"></span></div><div class="recipient-line"><span class="recipient-label">To</span><span x-text="recipients(currentMessage.addresses?.to)"></span></div></div><time class="message-date" :datetime="currentMessage.sent_at" x-text="fullDate(currentMessage.sent_at)"></time></div>
                                <template x-for="kind in ['cc', 'bcc']" :key="kind"><div class="extra-recipients" x-show="currentMessage.addresses?.[kind]?.length"><span class="recipient-label" x-text="kind === 'cc' ? 'Cc' : 'Bcc'"></span><span x-text="recipients(currentMessage.addresses?.[kind])"></span></div></template>
                            </header>
                            <div class="body-status" x-show="messageLoading" role="status"><i class="ti ti-loader-2 icon-spin" aria-hidden="true"></i> Loading message…</div>
                            <div class="body-status error-notice" x-show="messageError" role="alert"><p x-text="messageError"></p><button @click="openMessage(currentMessage)">Try again</button></div>
                            <div x-show="!messageLoading && !messageError">
                                <div class="text-body" x-show="bodyMode === 'text'" x-html="currentMessage.textBody"></div>
                                <template x-if="bodyMode === 'html'"><iframe class="html-body" title="HTML email content" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" :srcdoc="currentMessage.htmlBody"></iframe></template>
                                <section class="attachments" x-show="currentMessage.attachments.length"><h3><i class="ti ti-paperclip" aria-hidden="true"></i> Attachments <span x-text="'(' + currentMessage.attachments.length + ')'"></span></h3><div class="attachment-list"><template x-for="attachment in currentMessage.attachments" :key="attachment.id"><a class="attachment" :href="'/web/api/messages/' + currentMessage.id + '/attachments/' + attachment.id + '/download'" target="_blank" rel="noopener"><i class="ti ti-file-text" aria-hidden="true"></i><span><strong x-text="attachment.filename || '(Unnamed attachment)'"></strong><small x-text="attachment.attachment_human_size"></small></span><i class="ti ti-download" aria-hidden="true"></i></a></template></div></section>
                            </div>
                        </div>
                    </div>
                </template>
            </section>
        </main>
    </div>
</body>
</html>
